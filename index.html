<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="header">
      <img
        class="header__image"
        src="./eisenhower-matrix.jpg"
        alt="Eisenhower Matrix"
      />
      <a
        class="header__link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </header>

    <main class="todo-app">
      <form class="task-form" id="task-form" action="#" method="get">
        <label class="task-form__label" for="new-task">Add Item</label>
        <div class="task-form__wrapper">
          <input
            id="new-task"
            class="task-form__input"
            name="task"
            type="text"
            maxlength="200"
            autocomplete="off"
          />
          <button class="task-form__button" type="submit">Add</button>
        </div>
      </form>

      <section class="tasks-section">
        <h2 class="tasks-section__title">Todo</h2>
        <ul class="tasks-list" id="incompleteTasks">
          <li class="task-item">
            <input class="task-item__checkbox" type="checkbox" />
            <label class="task-item__label">Pay Bills</label>
            <input class="task-item__input" type="text" />
            <button
              class="task-item__button task-item__button--edit"
              type="button"
            >
              Edit
            </button>
            <button
              class="task-item__button task-item__button--delete"
              type="button"
            >
              <img class="task-item__icon" src="./remove.svg" alt="Delete" />
            </button>
          </li>
          <li class="task-item task-item--edit">
            <input class="task-item__checkbox" type="checkbox" />
            <label class="task-item__label">Go Shopping</label>
            <input class="task-item__input" type="text" value="Go Shopping" />
            <button
              class="task-item__button task-item__button--edit"
              type="button"
            >
              Save
            </button>
            <button
              class="task-item__button task-item__button--delete"
              type="button"
            >
              <img class="task-item__icon" src="./remove.svg" alt="Delete" />
            </button>
          </li>
        </ul>
      </section>

      <section class="tasks-section">
        <h2 class="tasks-section__title">Completed</h2>
        <ul class="tasks-list" id="completed-tasks">
          <li class="task-item">
            <input class="task-item__checkbox" type="checkbox" checked />
            <label class="task-item__label">See the Doctor</label>
            <input class="task-item__input" type="text" />
            <button
              class="task-item__button task-item__button--edit"
              type="button"
            >
              Edit
            </button>
            <button
              class="task-item__button task-item__button--delete"
              type="button"
            >
              <img class="task-item__icon" src="./remove.svg" alt="Delete" />
            </button>
          </li>
        </ul>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
